[project]
name = "ai-career-intelligence-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt==4.3.0",
    "email-validator>=2.3.0",
    "groq>=1.7.0",
    "passlib==1.7.4",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.13.0",
    "pypdf>=6.17.0",
    "python-multipart>=0.0.32",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
